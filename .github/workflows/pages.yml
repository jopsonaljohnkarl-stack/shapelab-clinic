name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only the site itself, not the repo's tooling files.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html privacy.html brandassets _site/
          # Pages serves this repo under a sub-path, so root-relative links
          # (href="/", href="/privacy.html") must become relative.
          sed -i -E 's#(href|src)="/([^/"][^"]*)"#\1="./\2"#g; s#href="/"#href="./"#g' _site/*.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
